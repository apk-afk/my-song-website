<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yatharth Music</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#080012,#18002e,#2a0052);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

/* Animated stars */
body::before{
    content:"";
    position:fixed;
    inset:-50%;
    background:
      radial-gradient(circle,#ffffff44 2px,transparent 3px);
    background-size:70px 70px;
    animation:bgMove 30s linear infinite;
    z-index:0;
}

@keyframes bgMove{
from{transform:translate(0,0);}
to{transform:translate(-180px,-180px);}
}

.container{
    position:relative;
    z-index:2;
    width:100%;
    max-width:820px;
}

.title{
    text-align:center;
    font-size:40px;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#ddd;
    margin-bottom:35px;
}

.grid{
    display:grid;
    gap:25px;
}

.card{
    padding:28px;
    border-radius:28px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 0 35px rgba(217,70,239,.35);
    text-align:center;
}

.cover{
    width:200px;
    height:200px;
    margin:auto;
    border-radius:24px;
    background:linear-gradient(135deg,#d946ef,#7c3aed,#2563eb);
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 0 30px #d946ef;
}

.disc{
    width:140px;
    height:140px;
    border-radius:50%;
    background:
      radial-gradient(circle,#666 10%,#111 12%,#444 50%,#111 100%);
    border:4px solid #ddd;
}

.spin{
    animation:spin 3s linear infinite;
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

h2{
    margin:20px 0 6px;
    font-size:28px;
}

.info{
    color:#ddd;
    margin-bottom:18px;
}

.eq{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:6px;
    height:42px;
    margin-bottom:22px;
}

.eq span{
    width:8px;
    height:12px;
    border-radius:20px;
    background:#d946ef;
    animation:bounce .8s infinite;
    animation-play-state:paused;
}

.eq.playing span{
    animation-play-state:running;
}

.eq span:nth-child(2){animation-delay:.1s;}
.eq span:nth-child(3){animation-delay:.2s;}
.eq span:nth-child(4){animation-delay:.3s;}
.eq span:nth-child(5){animation-delay:.4s;}
.eq span:nth-child(6){animation-delay:.5s;}

@keyframes bounce{
0%,100%{height:12px;}
50%{height:40px;}
}

.controls{
    display:flex;
    justify-content:center;
    gap:15px;
}

button{
    border:none;
    cursor:pointer;
    transition:.25s;
}

.playBtn{
    width:72px;
    height:72px;
    border-radius:50%;
    background:linear-gradient(135deg,#d946ef,#7c3aed);
    color:white;
    font-size:30px;
    box-shadow:0 0 20px #d946ef;
}

.playBtn:hover{
    transform:scale(1.08);
}

.loopBtn{
    padding:0 18px;
    border-radius:30px;
    background:#333;
    color:white;
}

.loopBtn.active{
    background:linear-gradient(135deg,#d946ef,#7c3aed);
    box-shadow:0 0 15px #d946ef;
}

footer{
    text-align:center;
    margin-top:35px;
    color:#bbb;
    font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<h1 class="title">🎵 Yatharth Music</h1>
<p class="subtitle">Original Tracks</p>

<div class="grid">

<!-- Midnight Pulse -->
<div class="card">

<div class="cover">
<div class="disc"></div>
</div>

<h2>Midnight Pulse</h2>
<p class="info">Original Track by Yatharth</p>

<div class="eq">
<span></span><span></span><span></span>
<span></span><span></span><span></span>
</div>

<div class="controls">
<button class="playBtn">▶</button>
<button class="loopBtn">🔁 Loop OFF</button>
</div>

<audio src="song.wav"></audio>

</div>

<!-- Happily Sad -->
<div class="card">

<div class="cover">
<div class="disc"></div>
</div>

<h2>Happily Sad</h2>
<p class="info">Final Version • 39 sec</p>

<div class="eq">
<span></span><span></span><span></span>
<span></span><span></span><span></span>
</div>

<div class="controls">
<button class="playBtn">▶</button>
<button class="loopBtn">🔁 Loop OFF</button>
</div>

<audio src="happily-sad.wav"></audio>

</div>

</div>

<footer>Made with ❤️ by Yatharth</footer>

</div>

<script>
const cards=document.querySelectorAll(".card");

cards.forEach(card=>{

const song=card.querySelector("audio");
const playBtn=card.querySelector(".playBtn");
const loopBtn=card.querySelector(".loopBtn");
const disc=card.querySelector(".disc");
const eq=card.querySelector(".eq");

playBtn.onclick=async()=>{

if(song.paused){

document.querySelectorAll("audio").forEach(a=>{
if(a!==song){
a.pause();
a.currentTime=0;
const c=a.closest(".card");
c.querySelector(".playBtn").innerHTML="▶";
c.querySelector(".disc").classList.remove("spin");
c.querySelector(".eq").classList.remove("playing");
}
});

await song.play();
playBtn.innerHTML="❚❚";
disc.classList.add("spin");
eq.classList.add("playing");

}else{

song.pause();
playBtn.innerHTML="▶";
disc.classList.remove("spin");
eq.classList.remove("playing");

}

};

loopBtn.onclick=()=>{

song.loop=!song.loop;

if(song.loop){
loopBtn.innerHTML="🔁 Loop ON";
loopBtn.classList.add("active");
}else{
loopBtn.innerHTML="🔁 Loop OFF";
loopBtn.classList.remove("active");
}

};

song.onended=()=>{

if(!song.loop){
playBtn.innerHTML="▶";
disc.classList.remove("spin");
eq.classList.remove("playing");
}

};

});
</script>

</body>
</html>
